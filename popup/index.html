<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCode</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="logo">⚡</span>
        <span class="title">OpenCode</span>
      </div>
      <div class="header-right">
        <button id="btn-new-session" class="icon-btn" title="新建会话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button id="btn-sidebar" class="icon-btn" title="固定到侧边栏">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Area -->
    <main class="chat-area" id="chat-area">
      <div class="welcome-message">
        <div class="welcome-icon">👋</div>
        <div class="welcome-text">有什么可以帮你的？</div>
        <div class="welcome-hints">
          <p>我可以帮你：</p>
          <ul>
            <li>分析当前页面</li>
            <li>执行自定义指令</li>
            <li>使用下方插件能力</li>
          </ul>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea 
          id="input-message" 
          placeholder="输入指令或问题..." 
          rows="1"
        ></textarea>
        <button id="btn-send" class="send-btn" title="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <label class="context-toggle">
        <input type="checkbox" id="include-page" checked>
        <span>附带当前页面内容</span>
      </label>
    </div>

    <!-- Plugin Dock -->
    <div class="plugin-dock">
      <div class="plugin-header" id="plugin-header">
        <span>📦 插件</span>
        <span class="toggle-icon">︿</span>
      </div>
      <div class="plugin-grid" id="plugin-grid">
        <button class="plugin-item" data-plugin="obsidian" title="保存到 Obsidian">
          <span class="plugin-icon">🗒️</span>
          <span class="plugin-name">Obsidian</span>
        </button>
        <button class="plugin-item plugin-add" title="添加更多插件">
          <span class="plugin-icon">+</span>
          <span class="plugin-name">添加</span>
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <footer class="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">正在连接...</span>
    </footer>

    <!-- Settings Panel (Hidden by default) -->
    <div class="settings-panel hidden" id="settings-panel">
      <header class="settings-header">
        <button id="btn-back" class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <span>设置</span>
      </header>
      <div class="settings-content">
        <section class="settings-section">
          <h3>🔌 OpenCode 连接</h3>
          <input type="text" id="server-url" value="http://localhost:4097" placeholder="服务器地址">
          <div class="connection-status">
            <span class="status-dot" id="settings-status-dot"></span>
            <span id="settings-status-text">未连接</span>
          </div>
        </section>
        
        <section class="settings-section">
          <h3>🗒️ Obsidian 设置</h3>
          <label class="settings-label">Vault 路径</label>
          <input type="text" id="obsidian-vault" placeholder="例如: C:\Users\你的用户名\Documents\Obsidian\MyVault">
          <label class="settings-label">保存文件夹</label>
          <input type="text" id="obsidian-folder" value="Inbox" placeholder="例如: Inbox 或 Clippings">
          <p class="settings-hint">文件将保存到 Vault路径/保存文件夹/ 目录下</p>
        </section>

        <section class="settings-section">
          <h3>📦 已安装插件</h3>
          <div class="plugin-list">
            <div class="plugin-list-item">
              <div class="plugin-info">
                <span class="plugin-icon">🗒️</span>
                <div>
                  <div class="plugin-title">Obsidian</div>
                  <div class="plugin-desc">保存网页到 Obsidian vault</div>
                </div>
              </div>
              <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </section>

        <section class="settings-section">
          <h3>🎨 外观</h3>
          <select id="theme-select">
            <option value="auto">跟随系统</option>
            <option value="light">亮色</option>
            <option value="dark">暗色</option>
          </select>
        </section>
      </div>
    </div>

    <!-- Plugin Panel (Hidden by default) -->
    <div class="plugin-panel hidden" id="plugin-panel">
      <header class="plugin-panel-header">
        <button id="btn-plugin-back" class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <span id="plugin-panel-title">插件</span>
      </header>
      <div class="plugin-panel-content" id="plugin-panel-content">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
