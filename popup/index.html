<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCode</title>
  <link rel="stylesheet" href="styles-swiss.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header" role="banner">
      <div class="header-left">
        <span class="title">OpenCode</span>
      </div>
      <div class="header-right">
        <button id="btn-new-session" class="icon-btn" title="新建会话" aria-label="新建会话">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button id="btn-sidebar" class="icon-btn" title="固定到侧边栏" aria-label="固定到侧边栏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="设置" aria-label="打开设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Area -->
    <main class="chat-area" id="chat-area" role="main" aria-label="聊天区域" aria-live="polite">
      <div class="welcome-message">
        <div class="welcome-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="welcome-text">有什么可以帮你的？</div>
        <div class="welcome-hints">
          <p>我可以帮你：</p>
          <ul>
            <li>分析当前页面</li>
            <li>执行自定义指令</li>
            <li>使用下方插件能力</li>
          </ul>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea 
          id="input-message" 
          placeholder="输入指令或问题..." 
          rows="1"
        ></textarea>
        <button id="btn-send" class="send-btn" title="发送" aria-label="发送消息">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Plugin Dock -->
    <div class="plugin-dock">
      <div class="plugin-header" id="plugin-header">
        <span class="plugin-header-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>
          </svg>
          插件
        </span>
        <span class="toggle-icon">︿</span>
      </div>
      <div class="plugin-grid" id="plugin-grid">
        <button class="plugin-item" data-plugin="obsidian" title="保存到 Obsidian">
          <span class="plugin-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </span>
          <span class="plugin-name">Obsidian</span>
        </button>
        <button class="plugin-item" data-plugin="twitter-sync" title="推特书签同步">
          <span class="plugin-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>
            </svg>
          </span>
          <span class="plugin-name">书签同步</span>
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <footer class="status-bar" role="status" aria-live="polite">
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <span class="status-text" id="status-text">正在连接...</span>
    </footer>

    <!-- Settings Panel (Hidden by default) -->
    <div class="settings-panel hidden" id="settings-panel">
      <header class="settings-header">
        <button id="btn-back" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <span>设置</span>
      </header>
      <div class="settings-content">
        <section class="settings-section">
          <h3>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 20V10M12 20V4M6 20v-6"/>
            </svg>
            OpenCode 连接
          </h3>
          <input type="text" id="server-url" value="http://localhost:4097" placeholder="服务器地址">
          <div class="connection-status">
            <span class="status-dot" id="settings-status-dot"></span>
            <span id="settings-status-text">未连接</span>
          </div>
        </section>
        
        <section class="settings-section">
          <h3>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            Obsidian 设置
          </h3>
          <label class="settings-label">Vault 路径</label>
          <input type="text" id="obsidian-vault" placeholder="例如: C:\Users\你的用户名\Documents\Obsidian\MyVault">
          <label class="settings-label">保存文件夹</label>
          <input type="text" id="obsidian-folder" value="Inbox" placeholder="例如: Inbox 或 Clippings">
          <p class="settings-hint">文件将保存到 Vault路径/保存文件夹/ 目录下</p>
        </section>

        <section class="settings-section">
          <h3>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            外观
          </h3>
          <select id="theme-select">
            <option value="auto">跟随系统</option>
            <option value="light">亮色</option>
            <option value="dark">暗色</option>
          </select>
        </section>
      </div>
    </div>

    <!-- Plugin Panel (Hidden by default) -->
    <div class="plugin-panel hidden" id="plugin-panel">
      <header class="plugin-panel-header">
        <button id="btn-plugin-back" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <span id="plugin-panel-title">插件</span>
      </header>
      <div class="plugin-panel-content" id="plugin-panel-content">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
